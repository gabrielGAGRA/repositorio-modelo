=== tests\pytest.ini ===
[pytest]
testpaths = .
pythonpath = ..
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers

markers =
    unit:
    integration:

[coverage:run]
omit =
    app/main.py

[coverage:report]
fail_under = 80
show_missing = true